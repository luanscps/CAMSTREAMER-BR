<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CamStreamer BR — Login</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0d0d;--surface:#141414;--border:#222;
    --text:#f0f0f0;--muted:#666;--accent:#e53935;
    --accent-hover:#c62828;--radius:10px;
  }
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:20px;
  }
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:40px 32px;
    width:100%;max-width:360px;
  }
  .logo{font-size:11px;letter-spacing:.18em;color:var(--muted);
        text-align:center;margin-bottom:6px;text-transform:uppercase}
  h1{font-size:19px;font-weight:700;text-align:center;margin-bottom:4px}
  .sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:28px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;margin-top:18px}
  input{
    width:100%;height:44px;background:#0d0d0d;
    border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-size:14px;padding:0 14px;
    outline:none;transition:border-color .2s;
  }
  input:focus{border-color:var(--accent)}
  .btn{
    margin-top:24px;width:100%;height:44px;
    background:var(--accent);border:none;border-radius:8px;
    color:#fff;font-size:14px;font-weight:700;
    letter-spacing:.06em;cursor:pointer;transition:background .2s;
  }
  .btn:hover{background:var(--accent-hover)}
  .btn:disabled{background:#333;color:#666;cursor:not-allowed}
  .error{min-height:18px;margin-top:12px;
         font-size:12px;color:#ff5252;text-align:center}
  .info{margin-top:16px;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="card">
  <p class="logo">CamStreamer BR</p>
  <h1>Painel Remoto</h1>
  <p class="sub">Use o mesmo e-mail e senha do aplicativo</p>

  <label for="email">E-mail</label>
  <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" />

  <label for="pwd">Senha</label>
  <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password" />

  <button class="btn" id="btnLogin" onclick="doLogin()">ENTRAR</button>
  <p class="error" id="errMsg"></p>
  <p class="info">Camera2 RTMP · v5-CAMUI</p>
</div>

<script>
  async function doLogin() {
    const email  = document.getElementById('email').value.trim();
    const pwd    = document.getElementById('pwd').value.trim();
    const btn    = document.getElementById('btnLogin');
    const errMsg = document.getElementById('errMsg');

    if (!email) { errMsg.textContent = 'Digite o e-mail'; return; }
    if (!pwd)   { errMsg.textContent = 'Digite a senha';  return; }

    btn.disabled    = true;
    btn.textContent = 'Verificando...';
    errMsg.textContent = '';

    try {
      const resp = await fetch('/auth/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email, password: pwd })
      });
      const data = await resp.json();

      if (resp.ok) {
        btn.textContent = 'Redirecionando...';
        setTimeout(() => window.location.href = '/', 400);
      } else {
        errMsg.textContent = data.message || 'Credenciais inválidas';
        btn.disabled    = false;
        btn.textContent = 'ENTRAR';
      }
    } catch(e) {
      errMsg.textContent = 'Erro de conexão com o dispositivo';
      btn.disabled    = false;
      btn.textContent = 'ENTRAR';
    }
  }

  ['email','pwd'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });
</script>
</body>
</html>
