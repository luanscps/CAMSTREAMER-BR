<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CamStreamer BR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box {
    width: 100%;
    max-width: 360px;
    padding: 0 16px;
  }
  .login-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-header h1 {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.3px;
  }
  .login-header p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .login-field {
    margin-bottom: 12px;
  }
  .login-field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .login-field input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    font-family: var(--font);
    transition: border-color .15s;
  }
  .login-field input:focus { border-color: var(--accent); }
  .login-field input::placeholder { color: var(--muted2); }
  .btn-login {
    width: 100%;
    padding: 11px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background .15s;
    font-family: var(--font);
  }
  .btn-login:hover { background: #e0e0e0; }
  .btn-login:disabled { background: var(--border2); color: var(--muted); cursor: not-allowed; }
  .login-error {
    font-size: 12px;
    color: var(--red);
    margin-top: 10px;
    text-align: center;
    min-height: 18px;
  }
  .login-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }
  .login-footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>
<div class="login-box">
  <div class="login-header">
    <h1>CamStreamer BR</h1>
    <p>Painel de controle remoto</p>
  </div>
  <div class="login-field">
    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
  </div>
  <div class="login-field">
    <label for="password">Senha</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn-login" id="btn-login" onclick="doLogin()">Entrar</button>
  <div class="login-error" id="login-error"></div>
  <hr class="login-divider">
  <div class="login-footer">Camera2 API &middot; NanoHTTPD &middot; v5-CAMUI</div>
</div>
<script>
function doLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('btn-login');
  const errEl    = document.getElementById('login-error');

  if (!email || !password) { errEl.textContent = 'Preencha e-mail e senha.'; return; }

  btn.disabled    = true;
  btn.textContent = 'Entrando...';
  errEl.textContent = '';

  fetch('/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  })
  .then(r => r.json())
  .then(data => {
    if (data.status === 'ok') {
      window.location.href = '/';
    } else {
      errEl.textContent = data.message || 'Credenciais invalidas.';
      btn.disabled    = false;
      btn.textContent = 'Entrar';
    }
  })
  .catch(() => {
    errEl.textContent = 'Erro de conexao. Tente novamente.';
    btn.disabled    = false;
    btn.textContent = 'Entrar';
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
